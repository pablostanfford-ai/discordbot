<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HelpDesk — панель тикетов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app/static/style.css">
  <script src="/app/static/app.js" defer></script>
</head>
<body>
  <!-- экран входа -->
  <div id="screen-login" class="screen">
    <div class="login-box">
      <div class="logo">🛠</div>
      <h1>Панель поддержки</h1>
      <p id="login-hint">Откройте это приложение через кнопку в чате бота — оно подключится автоматически.</p>
      <button id="btn-connect" class="btn primary hidden">Подключиться (dev-режим)</button>
      <button id="btn-seed" class="btn ghost hidden">➕ Засеять демо-тикеты</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <!-- основная панель: список + чат -->
  <div id="screen-main" class="screen hidden">
    <header class="topbar">
      <button id="btn-back" class="icon-btn hidden" title="Назад">←</button>
      <div class="topbar-title">
        <strong id="view-title">Тикеты</strong>
        <span id="view-sub" class="dim"></span>
      </div>
      <button id="btn-refresh" class="icon-btn" title="Обновить">⟳</button>
    </header>

    <!-- СПИСОК -->
    <section id="view-list" class="view">
      <div class="stats-row" id="stats-row"></div>
      <input id="search" class="search" type="search" placeholder="Поиск по имени, тексту, тегу, № тикета…">
      <div class="tabs" id="status-tabs">
        <button data-status="all" class="tab active">Все</button>
        <button data-status="open" class="tab">Новые</button>
        <button data-status="in_progress" class="tab">В работе</button>
        <button data-status="answered" class="tab">Отвечено</button>
        <button data-status="closed" class="tab">Закрытые</button>
      </div>
      <div class="tag-cloud hidden" id="tag-cloud"></div>
      <div id="ticket-list" class="ticket-list"><div class="empty">Загрузка…</div></div>
    </section>

    <!-- ЧАТ С КЛИЕНТОМ -->
    <section id="view-chat" class="view hidden">
      <div id="chat-info" class="chat-info"></div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="tags-editor">
        <span class="dim tags-label">Теги:</span>
        <span id="tags-chips"></span>
        <input id="tag-input" class="tag-input" type="text" placeholder="+ тег (Enter)" maxlength="30">
      </div>
      <div class="chat-actions">
        <button data-set-status="in_progress" class="chip">⏳ В работу</button>
        <button data-set-status="closed" class="chip ok">✅ Закрыть</button>
        <button data-set-status="open" class="chip warn">🔓 Открыть заново</button>
      </div>
      <form id="reply-form" class="reply-form">
        <textarea id="reply-text" rows="2" placeholder="Написать клиенту…" maxlength="3500"></textarea>
        <button type="submit" class="btn primary send">➤</button>
      </form>
    </section>
  </div>
</body>
</html>
