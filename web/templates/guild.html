{% extends "base.html" %}
{% block title %}Сервер — UniDash{% endblock %}
{% block head_scripts %}<script src="/static/js/guild.js" defer></script>{% endblock %}
{% block content %}
<div class="container">
  <div id="guild-header"></div>
  <div class="layout">
    <aside class="sidebar">
      <button class="tab-btn active" data-tab="overview">📊 Обзор</button>
      <button class="tab-btn" data-tab="general">⚙️ Основные</button>
      <button class="tab-btn" data-tab="welcome">👋 Приветствия</button>
      <button class="tab-btn" data-tab="automod">🛡️ AutoMod</button>
      <button class="tab-btn" data-tab="leveling">📈 Уровни</button>
      <button class="tab-btn" data-tab="logging">📝 Логирование</button>
      <button class="tab-btn" data-tab="members">👥 Участники</button>
      <button class="tab-btn" data-tab="modlog">🗂️ Журнал</button>
    </aside>
    <main class="content-area" id="content-area">
      <div class="tab-panel" id="tab-overview"><span class="spinner"></span></div>
      <div class="tab-panel hidden" id="tab-general"></div>
      <div class="tab-panel hidden" id="tab-welcome"></div>
      <div class="tab-panel hidden" id="tab-automod"></div>
      <div class="tab-panel hidden" id="tab-leveling"></div>
      <div class="tab-panel hidden" id="tab-logging"></div>
      <div class="tab-panel hidden" id="tab-members"></div>
      <div class="tab-panel hidden" id="tab-modlog"></div>
    </main>
  </div>
</div>
{% endblock %}
